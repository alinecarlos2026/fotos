<!DOCTYPE html>
<html>

<head>
    <title>Fotos do Nosso Casamento</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
            background: radial-gradient(circle, #1f4373, #7a9fbf, #111c59);

        }

        h1 {
            color: white;
            text-shadow: 2px 2px 5px #111c59;
        }

        h2 {
            color: #111c59;
            text-shadow: 2px 2px 5px #1f437383;
        }

        p {
            color: #1f4373;
        }

        .card {
            background-image: url("1.jpg");
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            margin: auto;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        button {
            background: linear-gradient(to right, #111c59, #1f4373);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        button:disabled {
            background-color: #ccc;
        }

        /* Estilo da Barra de Progresso */
        #progressContainer {
            display: none;
            width: 100%;
            background-color: #7a9fbf;
            border-radius: 10px;
            margin: 15px 0;
            overflow: hidden;
        }

        #progressBar {
            width: 0%;
            height: 20px;
            background-color: #1f4373;
            text-align: center;
            color: #111c59;
            font-size: 12px;
            line-height: 20px;
            transition: width 0.3s;
        }

        .botao-upload {
            display: inline-block;
            padding: 10px 20px;
            background: linear-gradient(135deg, #7a9fbf, #1f4373);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .botao-upload:hover {
            opacity: 0.8;
        }
    </style>
</head>

<body>
    <h1> Valeu pela contribuição!<br><br> - Aline & Carlos -</h1>
    <div class="card">



        <label for="arquivo" class="botao-upload" id="btnVoltar">
            &larr; Enviar mais Fotos
        </label>

    </div>

    <script>


        document.getElementById('btnVoltar').onclick = () => {
            window.location.href = "index.html";
        };







    </script>
</body>

</html>
